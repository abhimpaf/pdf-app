[project]
name = "pdf-app"
version = "0.1.0"
description = "CLI to shrink PDF file size and convert PDFs to DOCX, JPEG, or PPTX"
requires-python = ">=3.9"
readme = "README.md"
dependencies = [
    "typer>=0.12",
    "rich>=13.7",
    "pymupdf>=1.24",
    "pdf2docx>=0.5.8",
    "python-pptx>=0.6.23",
    "Pillow>=10.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
pdf-app = "pdfapp.cli:app"

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["pdfapp*"]
